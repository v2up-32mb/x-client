name: Release APK

on:
  push:
    tags:
      - 'v*'  # tag 触发：构建 + 签名 + 发版
  workflow_dispatch:  # 默认 unsigned release CI；可选独立 debug 试用，均不发版
    inputs:
      trial_build:
        description: '构建独立安装的试用 APK（Go race 测试 + gomobile + debug 签名，不发布）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ── 1. 基础信息（串行头）：版本计算与发布判定，输出给全部下游 job ──
  meta:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      is_trial: ${{ steps.version.outputs.is_trial }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 版本号基于提交次数、release notes 基于 git log

      - name: Compute version
        id: version
        env:
          # inputs 上下文保留 boolean 类型；tag 即使由 dispatch 选择也绝不启用试用
          TRIAL_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.trial_build == true }}
        run: |
          # tag 触发：发版构建，版本名取 tag；手动触发：仅 CI 构建，版本名用 ci-<shortsha>
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "version_name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "version_name=ci-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" && "$TRIAL_REQUESTED" == "true" ]]; then
            echo "is_trial=true" >> $GITHUB_OUTPUT
          else
            echo "is_trial=false" >> $GITHUB_OUTPUT
          fi
          echo "version_code=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          # 语义化版本预发布标记（如 v1.2.0-preview.1 / -beta.1 / -rc.1）→ GitHub prerelease 标记；非 tag 一律 false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. 编译（needs 仅 meta，与 build-aar.yml 的 AAR 预热天然并行）：
  #    普通模式 AAR 命中 → 直接 assemble；试用/未命中 → 后台 bind ∥ 前台准备 → 汇合 assemble ──
  # 注：SDK/NDK 准备不能拆到独立 job——Actions 每个 job 独立 runner VM，装好的环境
  # 无法跨 job 传递（只有 artifact/cache/outputs 三种机制），拆出去只会重复安装；
  # gomobile bind 同理不能另开 job 再传回（artifact 在上游 job 结束前不存在，
  # download-artifact 无 wait 机制）——改为 job 内后台进程并行（见下）
  compile:
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore gomobile AAR cache
        # 按全部 golib Go 文件（含新增入口/ipopt）哈希缓存；普通构建命中跳过 Go/bind；
        # 试用即使命中也执行 race 测试和真实 bind，不能用旧 AAR 冒充新接口验证。
        # 常态下该缓存由 build-aar.yml 在 main 预热（同 key），tag 触发可直接命中；
        # 未命中时本 job 结束会自动 save，下次命中
        uses: actions/cache@v6
        id: aar_cache
        with:
          path: app/libs/xclient.aar
          key: gomobile-aar-${{ hashFiles('golib/**/*.go', 'golib/go.mod', 'golib/go.sum') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          # 单行写法：多行块标量会被 action 拼接成单个包名；版本与 app/build.gradle 对齐（compileSdk 34）
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Ensure NDK (externalNativeBuild)
        run: |
          # 幂等：runner 已预装则秒过；缺则补装（hev-socks5-tunnel 的 JNI 构建依赖）
          sdkmanager --install "ndk;26.3.11579264" >/dev/null 2>&1 || true
          ls /usr/local/lib/android/sdk/ndk/ | grep -q 26.3.11579264 && echo "NDK 26.3.11579264 ✓"

      - name: Setup Go
        if: needs.meta.outputs.is_trial == 'true' || steps.aar_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # 关闭 action 内置缓存（下方已显式用 actions/cache 管理 GOMODCACHE/GOCACHE，
          # 双层缓存会重复上传；且内置缓存在仓库根探测 go.mod，本仓在 golib/ 下会发告警）
          cache: false

      - name: Restore Go build cache
        # bind 提速：模块缓存 + 构建缓存（key 随 golib 内容变化自动失效；job 结束时自动 save）
        if: needs.meta.outputs.is_trial == 'true' || steps.aar_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomobile-toolchain-${{ runner.os }}-${{ hashFiles('golib/go.sum') }}-${{ hashFiles('golib/**/*.go', 'golib/go.mod') }}
          restore-keys: |
            gomobile-toolchain-${{ runner.os }}-${{ hashFiles('golib/go.sum') }}-

      - name: Guard API 24 source and instrumentation result protocol (trial)
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        run: |
          python3 app/src/static_checks/preferred_ip_feedback.py
          python3 app/src/static_checks/preferred_ip_instrumentation.py --self-test

      - name: Run Go race tests (trial, never skipped by AAR cache)
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        working-directory: golib
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      - name: Start gomobile bind in background
        # 试用或 AAR 缓存未命中时，将真实 gomobile bind 放入后台，
        # 与前台的 SDK/gradle 准备、依赖下载并行；每步是独立 bash 进程，跨步骤不能 wait，
        # 故用完成标记 + pid 探活收尾（见下方 Wait 步骤）。
        # 普通模式由 main 预热缓存兜底；试用始终重新绑定并检查新 API
        if: needs.meta.outputs.is_trial == 'true' || steps.aar_cache.outputs.cache-hit != 'true'
        run: |
          # x/mobile 2026-08-21 (b9947785) 起 go 指令要求 >= 1.26，setup-go 必须保持 >= 1.26
          rm -f /tmp/bind.done
          (
            set -e
            go install golang.org/x/mobile/cmd/gomobile@latest
            gomobile init
            cd golib
            mkdir -p ../app/libs
            go get golang.org/x/mobile/bind
            gomobile bind -target=android -androidapi=24 -o ../app/libs/xclient.aar
            touch /tmp/bind.done
          ) > /tmp/bind.log 2>&1 &
          echo $! > /tmp/bind.pid
          echo "bind 已后台启动 (pid $(cat /tmp/bind.pid))，与前台准备步骤并行"

      - name: Clone hev-socks5-tunnel
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni

      - name: Gradle wrapper
        run: |
          # wrapper 已提交仓库（gradle-9.2.1，与 AGP 8 兼容）；此处仅兜底：
          # runner 预装 gradle 为 9.7.x，评估 app/build.gradle 会触发 AGP 8 内部 API 移除错误，
          # 故仅在仓库缺 wrapper 时才生成（届时需留意预装 gradle 版本兼容性）
          if [ ! -f gradlew ]; then
            gradle wrapper >/dev/null
            chmod +x gradlew
            echo "::warning::仓库缺少 gradle wrapper，已用 runner 预装 gradle 生成——建议将 gradlew/gradle-wrapper 提交入库"
          else
            chmod +x gradlew
          fi

      - name: Download dependencies
        run: ./gradlew dependencies --no-daemon >/dev/null

      - name: Wait for background bind
        # 汇合后台 bind：完成标记存在 → 成功；进程已退出且无标记 → 失败（打日志终止）
        if: needs.meta.outputs.is_trial == 'true' || steps.aar_cache.outputs.cache-hit != 'true'
        run: |
          pid=$(cat /tmp/bind.pid)
          for i in $(seq 1 240); do
            [ -f /tmp/bind.done ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::gomobile bind 失败（进程已退出，无完成标记）"
              tail -n 40 /tmp/bind.log
              exit 1
            fi
            sleep 5
          done
          [ -f /tmp/bind.done ] || { echo "::error::gomobile bind 超时（20 分钟）"; exit 1; }
          tail -n 5 /tmp/bind.log
          test -f app/libs/xclient.aar && ls -la app/libs

      - name: Run Go race tests against bind-resolved dependencies (trial)
        # 原有绑定工具准备会临时改写 runner 的模块图；首轮 race 只验证仓库依赖。
        # 绑定后再以 readonly 模式验证实际选中集合，不能将首轮结果冒充 APK 的依赖验证。
        # 不提交/升级仓库 go.mod/go.sum，也不改变普通构建或 tag 发版路径。
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        working-directory: golib
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly
        run: |
          test "$(go list -m -f '{{.Version}}' github.com/v2up-32mb/gcm)" = v0.1.1
          test "$(go list -m -f '{{.Version}}' github.com/v2up-32mb/xshared)" = v0.1.5
          test "$(go list -m -f '{{.Version}}' github.com/v2up-32mb/xtunnel)" = v0.3.4
          # 无参数 download 不写回新增校验和；显式 all 只下载当前已选集合。
          # 仅此命令允许写 sum，之后恢复 readonly；模块文件/版本列表均须不变。
          cp go.mod "$RUNNER_TEMP/bind-resolved.go.mod"
          go list -m all > "$RUNNER_TEMP/bind-resolved.modules"
          GOFLAGS= go mod download all
          cmp go.mod "$RUNNER_TEMP/bind-resolved.go.mod"
          go list -m all > "$RUNNER_TEMP/bind-tested.modules"
          cmp "$RUNNER_TEMP/bind-resolved.modules" "$RUNNER_TEMP/bind-tested.modules"
          go list -m all
          go test -race -count=1 ./...

      - name: Verify preferred IP gomobile JSON API (trial)
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        run: |
          # 检查真实 bind 产物中的固定 API 名称/参数/返回类型，禁止旧 AAR 伪通过。
          api_dir=$(mktemp -d)
          unzip -p app/libs/xclient.aar classes.jar > "$api_dir/classes.jar"
          javap -classpath "$api_dir/classes.jar" xclient.Xclient > "$api_dir/api.txt"
          cat "$api_dir/api.txt"
          for signature in \
            'public static native java.lang.String parsePreferredIPList(java.lang.String, java.lang.String, java.lang.String) throws java.lang.Exception;' \
            'public static native java.lang.String startPreferredIPTask(java.lang.String) throws java.lang.Exception;' \
            'public static native java.lang.String getPreferredIPTask(java.lang.String) throws java.lang.Exception;' \
            'public static native void cancelPreferredIPTask(java.lang.String);'; do
            grep -Fq "$signature" "$api_dir/api.txt" || {
              echo "::error::gomobile API 不匹配: $signature"
              exit 1
            }
          done
          rm -rf "$api_dir"

      - name: Build trial debug APK (default debug signing, separate app data)
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -PTRIAL_BUILD=true \
            -PVERSION_CODE=${{ needs.meta.outputs.version_code }} \
            -PVERSION_NAME=${{ needs.meta.outputs.version_name }}-trial \
            --no-daemon

      - name: Run registered safety and native widget cases on API 24 emulator (trial)
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Use the existing SDK tools, not a new emulator action or a physical device.
          # AOSP image has no Play services/account; native UI uses simulated network wire only.
          SDK="${ANDROID_HOME:?Android SDK missing}"
          ADB="$SDK/platform-tools/adb"
          EMULATOR="$SDK/emulator/emulator"
          BT="$SDK/build-tools/34.0.0"
          IMAGE='system-images;android-24;default;x86_64'
          SERIAL=emulator-5554
          work=$(mktemp -d "$RUNNER_TEMP/preferred-ip-api24.XXXXXX")
          export ANDROID_AVD_HOME="$work/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          emulator_pid=''
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$status" != 0 ]]; then
              echo "::error::API 24 offline feedback verification failed (status $status)"
              if [[ -f "$work/emulator.log" ]]; then tail -n 100 "$work/emulator.log" || true; fi
              if [[ -f "$work/instrumentation.txt" ]]; then cat "$work/instrumentation.txt" || true; fi
              # Diagnostics/cleanup alone are best-effort; never change the failing status.
              timeout 15s "$ADB" -s "$SERIAL" logcat -d -t 200 || true
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 10s "$ADB" -s "$SERIAL" emu kill >/dev/null 2>&1 || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 1' INT TERM

          # No KVM / unavailable image / boot timeout is a hard failure, never a skip.
          [[ -c /dev/kvm ]] || { echo '::error::KVM device is required'; exit 1; }
          timeout 10s sudo -n chmod a+rw /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || { echo '::error::KVM is not accessible'; exit 1; }
          timeout 480s sdkmanager --install 'emulator' "$IMAGE"
          timeout 20s "$EMULATOR" -accel-check
          printf 'no\n' | timeout 60s avdmanager create avd --force --name preferred-ip-api24 --package "$IMAGE"
          timeout 20s "$ADB" start-server
          "$EMULATOR" -avd preferred-ip-api24 -port 5554 -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -cores 2 -memory 2048 \
            -camera-back none -camera-front none > "$work/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=false
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            kill -0 "$emulator_pid" 2>/dev/null || { echo '::error::Emulator exited before boot'; exit 1; }
            # A disconnected/not-yet-booted adb is expected ONLY within this bounded wait.
            boot=$(timeout 5s "$ADB" -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot" == 1 ]] && timeout 5s "$ADB" -s "$SERIAL" shell pm path android 2>/dev/null | grep -q '^package:'; then
              booted=true
              break
            fi
            sleep 2
          done
          [[ "$booted" == true ]] || { echo '::error::API 24 boot/package manager timed out (240s)'; exit 1; }
          api=$(timeout 10s "$ADB" -s "$SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')
          [[ "$api" == 24 ]] || { echo "::error::Expected API 24, got $api"; exit 1; }
          echo "Offline feedback target: Android API $api emulator ($IMAGE)"

          apk=app/build/outputs/apk/debug/app-universal-debug.apk
          test_apk=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$apk" && test -f "$test_apk"
          "$BT/aapt" dump badging "$apk" | grep -F "package: name='com.x.client.app.trial'"
          "$BT/aapt" dump badging "$test_apk" > "$work/test-badging.txt"
          grep -F "package: name='com.x.client.app.trial.test'" "$work/test-badging.txt"
          if grep -Eq "uses-library(-not-required)?:.*android[.]test[.]" "$work/test-badging.txt"; then
            echo '::error::The system runner must not depend on optional android.test libraries'
            exit 1
          fi
          timeout 90s "$ADB" -s "$SERIAL" install -r "$apk" | tr -d '\r' | tee "$work/install-app.txt"
          grep -Fx 'Success' "$work/install-app.txt"
          timeout 90s "$ADB" -s "$SERIAL" install -r -t "$test_apk" | tr -d '\r' | tee "$work/install-test.txt"
          grep -Fx 'Success' "$work/install-test.txt"
          component=com.x.client.app.trial.test/com.x.client.app.PreferredIpFeedbackInstrumentation
          timeout 15s "$ADB" -s "$SERIAL" shell pm list instrumentation | tr -d '\r' | \
            grep -Fx "instrumentation:$component (target=com.x.client.app.trial)"

          # am instrument can exit 0 on AssertionError/process crash: require both a
          # successful command AND 105 ordered named PASS records + final bundle + code -1.
          set +e
          timeout 900s "$ADB" -s "$SERIAL" shell am instrument -w -r "$component" > "$work/instrumentation.txt" 2>&1
          instrument_status=$?
          set -e
          cat "$work/instrumentation.txt"
          [[ "$instrument_status" == 0 ]] || { echo "::error::Instrumentation command failed/timed out ($instrument_status)"; exit 1; }
          python3 app/src/static_checks/preferred_ip_instrumentation.py "$work/instrumentation.txt" | tee "$work/verified.txt"
          {
            echo '### API 24 emulator 离线反馈断言'
            echo '六组数据安全回归及99组原生控件/AtomicFile/受控并发/真实配置用例；网络仅fixture。该测试lane仍不覆盖完整v2契约，不是公网/VPN/WebSocket验证。'
            cat "$work/verified.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          # Test APK/AVD/logs stay on this ephemeral CI runner, never in delivery artifacts.

      - name: Verify trial APK and write installation guidance
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        run: |
          apk=app/build/outputs/apk/debug/app-universal-debug.apk
          test -f "$apk"
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          "$BT/apksigner" verify --verbose --print-certs "$apk"
          "$BT/aapt" dump badging "$apk" | grep -F "package: name='com.x.client.app.trial'"
          {
            echo "### 独立试用 APK"
            echo "下载本次运行的 x-client-trial-debug-universal artifact（保留 7 天）。"
            echo "默认 Android debug 签名，仅供测试；包名 com.x.client.app.trial，可与正式版并存。"
            echo "试用版拥有独立数据，需要通过 URI 导入已有节点，不会迁移或覆盖正式版配置。"
            echo "已执行仓库依赖与绑定后实际依赖的两轮 Go race 测试、真实 gomobile bind、固定 JSON API 签名检查、assembleDebug/assembleDebugAndroidTest 及 API 24 emulator 登记的105组数据/原生控件断言（105/105 PASS，仅登记用例；完整v2契约仍有缺口）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trial universal APK
        if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: x-client-trial-debug-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK
        if: needs.meta.outputs.is_trial != 'true'
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ needs.meta.outputs.version_code }} \
            -PVERSION_NAME=${{ needs.meta.outputs.version_name }} \
            --no-daemon

      - name: Upload unsigned APK artifact
        if: needs.meta.outputs.is_trial != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 1

  # ── 3. 签名（仅 tag）：zipalign + apksigner ──
  sign:
    needs: [meta, compile]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-unsigned
          path: apk-unsigned

      - name: Setup build-tools for signing
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;34.0.0

      # r0adkll/sign-android-release 全系列硬编码 build-tools 29.0.3（无 buildToolsVersion 输入），
      # 与 SDK 包列表（34.0.0）不匹配，改用 build-tools 34.0.0 自带 zipalign + apksigner 等价签名
      - name: Sign APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          mkdir -p apk-signed
          echo "$SIGNING_KEY" | base64 --decode > keystore.jks
          EXTRA_KEY_ARGS=""
          if [ -n "$KEY_PASSWORD" ]; then
            EXTRA_KEY_ARGS="--key-pass pass:$KEY_PASSWORD"
          fi
          for apk in apk-unsigned/*-unsigned.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "${apk%-unsigned.apk}")"
            "$BT/zipalign" -f -p 4 "$apk" "${base}-aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" $EXTRA_KEY_ARGS \
              --out "apk-signed/x-client-${base#app-}.apk" "${base}-aligned.apk"
            rm -f "${base}-aligned.apk"
            echo "Signed: apk-signed/x-client-${base#app-}.apk"
          done
          rm -f keystore.jks
          ls -la apk-signed

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-signed
          path: apk-signed/*.apk
          retention-days: 1

  # ── 4. 发布（仅 tag，串行在签名后）：release notes + GitHub Release ──
  publish:
    needs: [meta, sign]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # notes 基于 git log/describe

      - name: Download signed APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-signed
          path: apk-signed

      - name: Generate Release Notes
        run: |
          APP_NAME="X Client"
          TAG_NAME=${{ github.ref_name }}

          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}" 2>/dev/null | grep -v "^${TAG_NAME}$" || echo "")
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || echo "")
          fi

          echo "RELEASE_TITLE=${APP_NAME} - ${TAG_NAME}" >> $GITHUB_ENV

          {
            echo "RELEASE_BODY<<EOF"
            echo "## 📦 更新内容"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${TAG_NAME}"
              echo "### 📝 Commits since ${PREV_TAG}"
            else
              RANGE=""
              echo "### 📝 All commits"
            fi
            echo ""

            print_section () {
              local type="$1"
              local title="$2"

              # -E：git log --grep 默认 BRE，^fix(\([^)]*\))?: 会被解释成
              # "fix + 字面( + 可选内容 + : "，导致 "fix: xxx" 永不匹配；
              # 扩展正则下 \( \) 才是字面括号，分组 ( ... )? 可选。
              COMMITS=$(git log $RANGE \
                --pretty=format:"- \`%h\` %s" \
                --grep="^${type}(\([^)]*\))?: " \
                -i -E)

              if [ -n "$COMMITS" ]; then
                echo "#### $title"
                echo "$COMMITS"
                echo ""
              fi
            }

            # Conventional Commit 分类
            print_section "feat"     "✨ 新功能（Features）"
            print_section "fix"      "🛠 修复（Fixes）"
            print_section "refactor" "♻️ 重构（Refactors）"
            print_section "perf"     "⚡ 性能优化（Performance）"
            print_section "docs"     "📚 文档（Docs）"
            print_section "build"    "🏗 构建（Build）"
            print_section "chore"    "🧹 其他（Chores）"

            echo "### 📥 下载说明"
            echo "请根据你的设备架构下载对应的 APK 文件："
            echo "- **armeabi-v7a**: 32位 ARM 设备"
            echo "- **arm64-v8a**: 64位 ARM 设备（大多数现代设备）"
            echo "- **x86**: 32位 x86 设备"
            echo "- **x86_64**: 64位 x86 设备"

            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          files: apk-signed/*.apk

  # ── 5. 手动触发的构建验证产物（非 tag）：unsigned APK 归档 ──
  ci-artifacts:
    needs: [meta, compile]
    if: needs.meta.outputs.is_tag != 'true' && needs.meta.outputs.is_trial != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-unsigned
          path: apk-unsigned

      - name: Upload CI artifacts (manual dispatch, unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: x-client-release-ci-unsigned
          path: apk-unsigned/*.apk
          retention-days: 7
