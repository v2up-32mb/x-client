name: Release APK

on:
  push:
    tags:
      - 'v*'  # 当推送以 'v' 开头的标签时触发
  workflow_dispatch:  # 手动重试（用于修复后重新构建）

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 26.3.11579264 
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整的 Git 历史，以便计算版本号

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Get version from tag
      run: |
        # 从 Git tag 中提取版本号
        VERSION_NAME=${{ github.ref_name }}
        # 去掉可能的 'v' 前缀
        echo "VERSION_NAME=${VERSION_NAME#v}" >> $GITHUB_ENV

        # 计算版本号（基于提交次数）
        VERSION_CODE=$(git rev-list --count HEAD)
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"

    - name: Detect prerelease
      run: |
        # 语义化版本预发布标记（如 v1.2.0-preview.1 / -beta.1 / -rc.1）→ GitHub prerelease 标记
        if echo "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 单行写法：多行块标量会被 action 拼接成单个包名；版本与 app/build.gradle 对齐（compileSdk 34）
        packages: platform-tools build-tools;34.0.0 platforms;android-34

    - name: Restore gomobile AAR cache
      # ③按 golib 内容哈希缓存交叉编译产物：命中时下方 Check 步骤直接跳过 gomobile（省 2-4 分钟）
      uses: actions/cache@v4
      with:
        path: app/libs/xclient.aar
        key: gomobile-aar-${{ hashFiles('golib/**/*.go', 'golib/go.mod', 'golib/go.sum') }}

    - name: Clone hev-socks5-tunnel
      run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni

    - name: Restore hev native build cache
      # ③按 jni 内容哈希缓存 NDK 编译中间产物（上游仓库更新时自动失效重编）
      uses: actions/cache@v4
      with:
        path: app/.cxx
        key: cxx-ndk263-${{ hashFiles('app/src/main/jni/**') }}

    # 条件编译xclient.aar
    - name: Check for xclient.aar
      id: check-xclient-aar
      run: |
        if [ -f "app/libs/xclient.aar" ]; then
          echo "xclient_aar_exists=true" >> $GITHUB_OUTPUT
        else
          echo "xclient_aar_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Go
      if: steps.check-xclient-aar.outputs.xclient_aar_exists == 'false'
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Install gomobile and Build xclient.aar
      if: steps.check-xclient-aar.outputs.xclient_aar_exists == 'false'
      run: |
        # 注意：x/mobile 2026-08-21 (b9947785) 起 go 指令要求 >= 1.26，
        # gomobile init 内部还会 go install gobind@latest，故 setup-go 必须保持 >= 1.26
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        cd golib
        mkdir -p ../app/libs
        go get golang.org/x/mobile/bind
        gomobile bind -target=android -androidapi=24 -o ../app/libs/xclient.aar
        cd ..

    # 条件生成 Gradle Wrapper
    - name: Check for Gradle Wrapper
      id: check-wrapper
      run: |
        if [ -f "gradlew" ]; then
          echo "wrapper_exists=true" >> $GITHUB_OUTPUT
        else
          echo "wrapper_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate Gradle Wrapper and Settings
      if: steps.check-wrapper.outputs.wrapper_exists == 'false'
      run: |
        # 生成 Gradle Wrapper
        gradle wrapper
        chmod +x gradlew
        # 输出提示，建议提交 wrapper 文件到仓库
        echo "Gradle wrapper generated. Consider committing these files to your repository:"
        echo "  gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar, gradle/wrapper/gradle-wrapper.properties"
        echo "To commit automatically, uncomment the 'Commit Gradle Wrapper' step below."

    #可选：提交 Gradle Wrapper 到仓库（默认禁用）
    - name: Commit Gradle Wrapper
      if: steps.check-wrapper.outputs.wrapper_exists == 'false'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add gradlew gradlew.bat gradle/wrapper/
        git commit -m "chore: add gradle wrapper [skip ci]" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref_name }}

    - name: Download dependencies
      run: ./gradlew dependencies --no-daemon

    - name: Build release APK
      run: ./gradlew assembleRelease -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME --no-daemon
    
    # r0adkll/sign-android-release 全系列硬编码 build-tools 29.0.3（无 buildToolsVersion 输入），
    # 与 SDK 包列表（34.0.0）不匹配，改用 build-tools 34.0.0 自带 zipalign + apksigner 等价签名
    - name: Sign APKs (zipalign + apksigner)
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        BT=/usr/local/lib/android/sdk/build-tools/34.0.0
        cd app/build/outputs/apk/release
        echo "$SIGNING_KEY" | base64 --decode > keystore.jks
        EXTRA_KEY_ARGS=""
        if [ -n "$KEY_PASSWORD" ]; then
          EXTRA_KEY_ARGS="--key-pass pass:$KEY_PASSWORD"
        fi
        for apk in *-unsigned.apk; do
          [ -e "$apk" ] || continue
          base="${apk%-unsigned.apk}"
          "$BT/zipalign" -f -p 4 "$apk" "${base}-aligned.apk"
          # shellcheck disable=SC2086
          "$BT/apksigner" sign \
            --ks keystore.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" $EXTRA_KEY_ARGS \
            --out "x-client-${base#app-}.apk" "${base}-aligned.apk"
          rm -f "$apk" "${base}-aligned.apk"
          echo "Signed: x-client-${base#app-}.apk"
        done
        rm -f keystore.jks
        ls -la

    - name: Generate Release Notes
      id: release_notes
      run: |
        # 设置应用名称
        APP_NAME="X Client"
        TAG_NAME=${{ github.ref_name }}

        # 获取上一个 tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        # 生成 Release 标题
        echo "RELEASE_TITLE=${APP_NAME} - ${TAG_NAME}" >> $GITHUB_ENV

        # 生成 Release Notes
        {
          echo "RELEASE_BODY<<EOF"
          echo "## 📦 更新内容"
          echo ""

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG_NAME}"
            echo "### 📝 Commits since ${PREV_TAG}"
          else
            RANGE=""
            echo "### 📝 All commits"
          fi
          echo ""

          print_section () {
            local type="$1"
            local title="$2"

            # -E：git log --grep 默认 BRE，^fix(\([^)]*\))?: 会被解释成
            # "fix + 字面( + 可选内容 + : "，导致 "fix: xxx" 永不匹配；
            # 扩展正则下 \( \) 才是字面括号，分组 ( ... )? 可选。
            COMMITS=$(git log $RANGE \
              --pretty=format:"- \`%h\` %s" \
              --grep="^${type}(\([^)]*\))?: " \
              -i -E)

            if [ -n "$COMMITS" ]; then
              echo "#### $title"
              echo "$COMMITS"
              echo ""
            fi
          }

          # Conventional Commit 分类
          print_section "feat"     "✨ 新功能（Features）"
          print_section "fix"      "🛠 修复（Fixes）"
          print_section "refactor" "♻️ 重构（Refactors）"
          print_section "perf"     "⚡ 性能优化（Performance）"
          print_section "docs"     "📚 文档（Docs）"
          print_section "build"    "🏗 构建（Build）"
          print_section "chore"    "🧹 其他（Chores）"

          echo "### 📥 下载说明"
          echo "请根据你的设备架构下载对应的 APK 文件："
          echo "- **armeabi-v7a**: 32位 ARM 设备"
          echo "- **arm64-v8a**: 64位 ARM 设备（大多数现代设备）"
          echo "- **x86**: 32位 x86 设备"
          echo "- **x86_64**: 64位 x86 设备"

          echo "EOF"
        } >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        name: ${{ env.RELEASE_TITLE }}
        body: ${{ env.RELEASE_BODY }}
        draft: false
        prerelease: ${{ env.IS_PRERELEASE }}
        files: app/build/outputs/apk/release/*.apk
                 
    - name: Notify on failure
      if: failure()
      run: |
        echo "发布失败，请检查日志"
