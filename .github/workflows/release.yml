name: Release APK

on:
  push:
    tags:
      - 'v*'  # tag 触发：构建 + 签名 + 发版
  workflow_dispatch:  # 手动触发：仅普通 CI 构建（release 类型，不上传 unsigned 产物，不发版）

permissions:
  contents: write

jobs:
  # ── 1. 基础信息（串行头）：版本计算与发布判定，输出给全部下游 job ──
  meta:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 版本号基于提交次数、release notes 基于 git log

      - name: Compute version
        id: version
        run: |
          # tag 触发：发版构建，版本名取 tag；手动触发：仅 CI 构建，版本名用 ci-<shortsha>
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "version_name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "version_name=ci-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "version_code=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Detect prerelease
        id: prerelease
        run: |
          # 语义化版本预发布标记（如 v1.2.0-preview.1 / -beta.1 / -rc.1）→ GitHub prerelease 标记；非 tag 一律 false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. 编译（needs 仅 meta，与 build-aar.yml 的 AAR 预热天然并行）：
  #    AAR 缓存命中 → 直接 assemble；未命中 → 后台 bind ∥ 前台 SDK/gradle 准备 → 汇合 assemble ──
  # 注：SDK/NDK 准备不能拆到独立 job——Actions 每个 job 独立 runner VM，装好的环境
  # 无法跨 job 传递（只有 artifact/cache/outputs 三种机制），拆出去只会重复安装；
  # gomobile bind 同理不能另开 job 再传回（artifact 在上游 job 结束前不存在，
  # download-artifact 无 wait 机制）——改为 job 内后台进程并行（见下）
  compile:
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore gomobile AAR cache
        # 按 golib 内容哈希命中交叉编译产物：命中跳过整段 Go 环境/bind（省 2-4 分钟）；
        # 常态下该缓存由 build-aar.yml 在 main 预热（同 key），tag 触发可直接命中；
        # 未命中时本 job 结束会自动 save，下次命中
        uses: actions/cache@v6
        id: aar_cache
        with:
          path: app/libs/xclient.aar
          key: gomobile-aar-${{ hashFiles('golib/**/*.go', 'golib/go.mod', 'golib/go.sum') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          # 单行写法：多行块标量会被 action 拼接成单个包名；版本与 app/build.gradle 对齐（compileSdk 34）
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Ensure NDK (externalNativeBuild)
        run: |
          # 幂等：runner 已预装则秒过；缺则补装（hev-socks5-tunnel 的 JNI 构建依赖）
          sdkmanager --install "ndk;26.3.11579264" >/dev/null 2>&1 || true
          ls /usr/local/lib/android/sdk/ndk/ | grep -q 26.3.11579264 && echo "NDK 26.3.11579264 ✓"

      - name: Setup Go
        if: steps.aar_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # 关闭 action 内置缓存（下方已显式用 actions/cache 管理 GOMODCACHE/GOCACHE，
          # 双层缓存会重复上传；且内置缓存在仓库根探测 go.mod，本仓在 golib/ 下会发告警）
          cache: false

      - name: Restore Go build cache
        # bind 提速：模块缓存 + 构建缓存（key 随 golib 内容变化自动失效；job 结束时自动 save）
        if: steps.aar_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomobile-toolchain-${{ runner.os }}-${{ hashFiles('golib/go.sum') }}-${{ hashFiles('golib/**/*.go', 'golib/go.mod') }}
          restore-keys: |
            gomobile-toolchain-${{ runner.os }}-${{ hashFiles('golib/go.sum') }}-

      - name: Start gomobile bind in background
        # AAR 缓存未命中时，将 gomobile bind（关键路径最大项，2-4 分钟）放入后台，
        # 与前台的 SDK/gradle 准备、依赖下载并行；每步是独立 bash 进程，跨步骤不能 wait，
        # 故用完成标记 + pid 探活收尾（见下方 Wait 步骤）。
        # 常态下 AAR 缓存由 build-aar.yml 在 main 预热（同 key），本步骤仅兜底
        if: steps.aar_cache.outputs.cache-hit != 'true'
        run: |
          # x/mobile 2026-08-21 (b9947785) 起 go 指令要求 >= 1.26，setup-go 必须保持 >= 1.26
          rm -f /tmp/bind.done
          (
            set -e
            go install golang.org/x/mobile/cmd/gomobile@latest
            gomobile init
            cd golib
            mkdir -p ../app/libs
            go get golang.org/x/mobile/bind
            gomobile bind -target=android -androidapi=24 -o ../app/libs/xclient.aar
            touch /tmp/bind.done
          ) > /tmp/bind.log 2>&1 &
          echo $! > /tmp/bind.pid
          echo "bind 已后台启动 (pid $(cat /tmp/bind.pid))，与前台准备步骤并行"

      - name: Clone hev-socks5-tunnel
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni

      - name: Gradle wrapper
        run: |
          # wrapper 已提交仓库（gradle-9.2.1，与 AGP 8 兼容）；此处仅兜底：
          # runner 预装 gradle 为 9.7.x，评估 app/build.gradle 会触发 AGP 8 内部 API 移除错误，
          # 故仅在仓库缺 wrapper 时才生成（届时需留意预装 gradle 版本兼容性）
          if [ ! -f gradlew ]; then
            gradle wrapper >/dev/null
            chmod +x gradlew
            echo "::warning::仓库缺少 gradle wrapper，已用 runner 预装 gradle 生成——建议将 gradlew/gradle-wrapper 提交入库"
          else
            chmod +x gradlew
          fi

      - name: Download dependencies
        run: ./gradlew dependencies --no-daemon >/dev/null

      - name: Wait for background bind
        # 汇合后台 bind：完成标记存在 → 成功；进程已退出且无标记 → 失败（打日志终止）
        if: steps.aar_cache.outputs.cache-hit != 'true'
        run: |
          pid=$(cat /tmp/bind.pid)
          for i in $(seq 1 240); do
            [ -f /tmp/bind.done ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::gomobile bind 失败（进程已退出，无完成标记）"
              tail -n 40 /tmp/bind.log
              exit 1
            fi
            sleep 5
          done
          [ -f /tmp/bind.done ] || { echo "::error::gomobile bind 超时（20 分钟）"; exit 1; }
          tail -n 5 /tmp/bind.log
          test -f app/libs/xclient.aar && ls -la app/libs

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ needs.meta.outputs.version_code }} \
            -PVERSION_NAME=${{ needs.meta.outputs.version_name }} \
            --no-daemon

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 1

  # ── 3. 签名（仅 tag）：zipalign + apksigner ──
  sign:
    needs: [meta, compile]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-unsigned
          path: apk-unsigned

      - name: Setup build-tools for signing
        uses: android-actions/setup-android@v4
        with:
          packages: build-tools;34.0.0

      # r0adkll/sign-android-release 全系列硬编码 build-tools 29.0.3（无 buildToolsVersion 输入），
      # 与 SDK 包列表（34.0.0）不匹配，改用 build-tools 34.0.0 自带 zipalign + apksigner 等价签名
      - name: Sign APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          mkdir -p apk-signed
          echo "$SIGNING_KEY" | base64 --decode > keystore.jks
          EXTRA_KEY_ARGS=""
          if [ -n "$KEY_PASSWORD" ]; then
            EXTRA_KEY_ARGS="--key-pass pass:$KEY_PASSWORD"
          fi
          for apk in apk-unsigned/*-unsigned.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "${apk%-unsigned.apk}")"
            "$BT/zipalign" -f -p 4 "$apk" "${base}-aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" $EXTRA_KEY_ARGS \
              --out "apk-signed/x-client-${base#app-}.apk" "${base}-aligned.apk"
            rm -f "${base}-aligned.apk"
            echo "Signed: apk-signed/x-client-${base#app-}.apk"
          done
          rm -f keystore.jks
          ls -la apk-signed

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-signed
          path: apk-signed/*.apk
          retention-days: 1

  # ── 4. 发布（仅 tag，串行在签名后）：release notes + GitHub Release ──
  publish:
    needs: [meta, sign]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # notes 基于 git log/describe

      - name: Download signed APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-signed
          path: apk-signed

      - name: Generate Release Notes
        run: |
          APP_NAME="X Client"
          TAG_NAME=${{ github.ref_name }}

          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}" 2>/dev/null | grep -v "^${TAG_NAME}$" || echo "")
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || echo "")
          fi

          echo "RELEASE_TITLE=${APP_NAME} - ${TAG_NAME}" >> $GITHUB_ENV

          {
            echo "RELEASE_BODY<<EOF"
            echo "## 📦 更新内容"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${TAG_NAME}"
              echo "### 📝 Commits since ${PREV_TAG}"
            else
              RANGE=""
              echo "### 📝 All commits"
            fi
            echo ""

            print_section () {
              local type="$1"
              local title="$2"

              # -E：git log --grep 默认 BRE，^fix(\([^)]*\))?: 会被解释成
              # "fix + 字面( + 可选内容 + : "，导致 "fix: xxx" 永不匹配；
              # 扩展正则下 \( \) 才是字面括号，分组 ( ... )? 可选。
              COMMITS=$(git log $RANGE \
                --pretty=format:"- \`%h\` %s" \
                --grep="^${type}(\([^)]*\))?: " \
                -i -E)

              if [ -n "$COMMITS" ]; then
                echo "#### $title"
                echo "$COMMITS"
                echo ""
              fi
            }

            # Conventional Commit 分类
            print_section "feat"     "✨ 新功能（Features）"
            print_section "fix"      "🛠 修复（Fixes）"
            print_section "refactor" "♻️ 重构（Refactors）"
            print_section "perf"     "⚡ 性能优化（Performance）"
            print_section "docs"     "📚 文档（Docs）"
            print_section "build"    "🏗 构建（Build）"
            print_section "chore"    "🧹 其他（Chores）"

            echo "### 📥 下载说明"
            echo "请根据你的设备架构下载对应的 APK 文件："
            echo "- **armeabi-v7a**: 32位 ARM 设备"
            echo "- **arm64-v8a**: 64位 ARM 设备（大多数现代设备）"
            echo "- **x86**: 32位 x86 设备"
            echo "- **x86_64**: 64位 x86 设备"

            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          files: apk-signed/*.apk

  # ── 5. 手动触发的构建验证产物（非 tag）：unsigned APK 归档 ──
  ci-artifacts:
    needs: [meta, compile]
    if: needs.meta.outputs.is_tag != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v8
        with:
          name: apk-unsigned
          path: apk-unsigned

      - name: Upload CI artifacts (manual dispatch, unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: x-client-release-ci-unsigned
          path: apk-unsigned/*.apk
