name: Build AAR

# 作用：在默认分支（main）作用域下预热 gomobile 交叉编译产物缓存。
# GitHub Actions 缓存作用域规则：默认分支上的缓存对所有 workflow（含 tag 触发的 release）可读；
# 特性分支缓存只有本分支可读——因此 AAR 必须从 main 构建并落缓存，release 才能命中。
# golib 变更 → 内容哈希变化 → 缓存自动失效重编，无过期风险。

on:
  push:
    branches: [main]
    paths:
      - 'golib/**'
      - '.github/workflows/build-aar.yml'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main  # 无论从哪里手动触发，固定构建 main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools build-tools;34.0.0 platforms;android-34

    - name: Setup Go
      # gomobile@latest 要求 go >= 1.26（x/mobile 2026-08-21 起）
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Restore gomobile AAR cache
      id: aar-cache
      uses: actions/cache@v4
      with:
        path: app/libs/xclient.aar
        key: gomobile-aar-${{ hashFiles('golib/**/*.go', 'golib/go.mod', 'golib/go.sum') }}

    - name: Build xclient.aar
      if: steps.aar-cache.outputs.cache-hit != 'true'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        cd golib
        mkdir -p ../app/libs
        go get golang.org/x/mobile/bind
        gomobile bind -target=android -androidapi=24 -o ../app/libs/xclient.aar

    - name: Verify AAR
      run: |
        test -f app/libs/xclient.aar
        echo "AAR ready: $(du -h app/libs/xclient.aar | cut -f1)"
