name: Build Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
      - 'fix/*'
      - 'repair/*'
      - 'refactor/**'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 26.3.11579264
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone hev-socks5-tunnel
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni

      # 条件编译 xclient.aar（CI 生成，不入库）
      - name: Check for xclient.aar
        id: check-xclient-aar
        run: |
          if [ -f "app/libs/xclient.aar" ]; then
            echo "xclient_aar_exists=true" >> $GITHUB_OUTPUT
          else
            echo "xclient_aar_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.check-xclient-aar.outputs.xclient_aar_exists == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install gomobile and Build xclient.aar
        if: steps.check-xclient-aar.outputs.xclient_aar_exists == 'false'
        run: |
          # gomobile init 内部会拉 gobind@latest，需与 Go 版本匹配。
          # 项目使用 Go 1.26，gomobile/gobind @latest 兼容。
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd golib
          mkdir -p ../app/libs
          go get golang.org/x/mobile/bind
          gomobile bind -target=android -androidapi=24 -o ../app/libs/xclient.aar
          cd ..

      # gradle wrapper 已提交到仓库（gradle/wrapper/*），无需重新生成
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download dependencies
        run: ./gradlew dependencies --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APKs per ABI
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app-x86-debug
          path: app/build/outputs/apk/debug/app-x86-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-debug
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
