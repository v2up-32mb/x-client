apply plugin: 'com.android.application'

// 仅显式 -PTRIAL_BUILD=true 的 debug 构建使用独立安装包；namespace/JNI 类名不变。
def trialBuild = providers.gradleProperty('TRIAL_BUILD').orElse('false').get() == 'true'

android {
    namespace "com.x.client.app"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"
    
    defaultConfig {
        applicationId "com.x.client.app"
        minSdkVersion 24
        targetSdkVersion 34
        // 从环境变量获取版本号，如果没有则使用默认值
        versionCode project.hasProperty('VERSION_CODE') ? VERSION_CODE.toInteger() : 1
        versionName project.hasProperty('VERSION_NAME') ? VERSION_NAME : "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        externalNativeBuild {
                        ndkBuild {
                                arguments "APP_CFLAGS+=-DPKGNAME=com/x/client/app -ffile-prefix-map=${rootDir}=."
                                arguments "APP_LDFLAGS+=-Wl,--build-id=none"
                        }
                }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
            if (trialBuild) {
                applicationIdSuffix ".trial"
            } else {
                applicationIdSuffix ".debug"
            }
        }
        release {
            minifyEnabled false
        }
    }

    // debug 资源覆盖 main 的 app_name，不向 main 注入同名 resValue。
    if (trialBuild) {
        sourceSets {
            debug {
                res.srcDir 'src/trial/res'
            }
        }
    } else {
        sourceSets {
            debug {
                res.srcDir 'src/debug/res'
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    externalNativeBuild {
		ndkBuild {
			path "src/main/jni/Android.mk"
		}
	}

	lintOptions {
		checkReleaseBuilds false
		// Or, if you prefer, you can continue to check for errors in release builds,
		// but continue the build even when errors are found:
		abortOnError false
	}

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation files('libs/xclient.aar')
    // QR code generation and scanning
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
